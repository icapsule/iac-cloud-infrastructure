name: "Terraform OCI Check (Lint & Validate)"

on:
  pull_request:
    paths:
      - 'stacks/oci-infra/**'
      - 'modules/compute/**'

jobs:
  lint-and-validate:
    name: "Format and Validate"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        # 不再需要 HCP Token 或云厂商凭证，GitHub 彻底变成无状态的语法检查器

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init (Backend disabled)
        # 加上 -backend=false，告诉 Terraform 不要去连 Terraform Cloud
        # 这样连 TF_API_TOKEN 都不需要了，极度安全
        run: terraform -chdir=stacks/oci-infra init -backend=false

      - name: Terraform Validate
        run: terraform -chdir=stacks/oci-infra validate -no-color
